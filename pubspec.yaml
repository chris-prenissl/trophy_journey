publish_to: 'none'
version: 0.1.2

environment:
  sdk: ^3.14.0-226.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  sqflite: ^2.4.3
  path: ^1.9.1
  marionette_flutter: ^0.6.0
  material_ui: ^1.5.0
