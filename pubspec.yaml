  webview_flutter: ^4.4.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  mockito: ^5.8.0
  build_runner: ^2.16.0
  json_serializable: ^6.14.1
